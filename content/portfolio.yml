home:
  introduction: I am Hyeonsu Lyu, Ph.D., a researcher at AiSLab in the Institute of New Media and Communications at Seoul National University.
  mission: My goal is to improve society's welfare and safety by developing connected mobile robotic systems. My research bridges robotics, wireless communications, and machine intelligence to advance that vision.
  research_interests: [Wireless Communications, Artificial Intelligence, Robotics, Intelligent Wireless Networks]
  research_statement: Lightweight mobile robots will soon achieve remarkable capabilities through AI-powered remote control, even without onboard computing. These systems can operate in extreme environments, perform high-risk tasks, and support disaster response, helping to build a safer and more sustainable society.
  research_focus: My work focuses on communication systems for AI and robotics, as well as intelligent agents for next-generation wireless networks. Ultimately, I aim to address societal challenges and promote the public good through the convergence of wireless communications, artificial intelligence, and robotics.

