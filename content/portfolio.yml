home:
  summary: Lightweight mobile robots can gain remarkable capabilities through AI-powered remote control without relying on onboard computing. I study communication systems for AI and robotics, together with intelligent agents for next-generation wireless networks, toward reliable systems for high-risk work, extreme environments, and disaster response.
  mission: My goal is to improve society's welfare and safety by developing connected mobile robotic systems. My research bridges robotics, wireless communications, and machine intelligence.
  research_interests: [Wireless Communications, Artificial Intelligence, Robotics, Intelligent Wireless Networks]

