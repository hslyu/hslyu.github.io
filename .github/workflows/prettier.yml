name: Verify portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          npm ci
          pip3 install -r vendor/awesome-phd-cv/research-cv/requirements.txt
      - name: Check formatting and sources
        run: |
          npm run lint:prettier
          npm run lint:style-contract
          git diff --check
      - name: Render CV source
        run: |
          python3 vendor/awesome-phd-cv/research-cv/scripts/render_cv.py \
            --portfolio content/portfolio.yml \
            --bibliography _bibliography/papers.bib \
            --extra vendor/awesome-phd-cv/research-cv/cv-extra.yml \
            --output vendor/awesome-phd-cv/research-cv/generated
      - name: Build site
        run: bundle exec jekyll build
