name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick poppler-utils
          pip3 install -r vendor/awesome-phd-cv/research-cv/requirements.txt
      - name: Generate CV source
        run: |
          python3 vendor/awesome-phd-cv/research-cv/scripts/render_cv.py \
            --portfolio content/portfolio.yml \
            --bibliography _bibliography/papers.bib \
            --extra vendor/awesome-phd-cv/research-cv/cv-extra.yml \
            --output vendor/awesome-phd-cv/research-cv/generated
      - name: Build CV PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex
          working_directory: vendor/awesome-phd-cv/research-cv
          latexmk_use_xelatex: true
      - name: Stage and verify CV PDF
        run: |
          mkdir -p assets/pdf
          cp vendor/awesome-phd-cv/research-cv/cv.pdf assets/pdf/hyeonsu-lyu-cv.pdf
          test -s assets/pdf/hyeonsu-lyu-cv.pdf
          pdfinfo assets/pdf/hyeonsu-lyu-cv.pdf | grep -q '^Pages:'
          pdftotext assets/pdf/hyeonsu-lyu-cv.pdf - | grep -q 'Hyeonsu Lyu'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
